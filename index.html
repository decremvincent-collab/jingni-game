<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>치킨 런</title>

<!-- 📱 Empêche zoom, scroll, resize mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;        /* empêche le scroll */
        touch-action: none;      /* empêche les gestes tactiles */
    }

    body {
        background-image: url('https://images4.alphacoders.com/133/thumb-1920-1332281.jpeg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-family: sans-serif;
    }

    /* 🐶 비숑 야쿠자 캐릭터 (이미지) */
    #player {
        position: absolute;
        bottom: 20px;
        left: 50px;
        width: 60px;
        height: 60px;
        background-image: url('https://png.pngtree.com/png-vector/20260110/ourlarge/pngtree-white-bichon-frise-running-happily-in-park-with-laughing-asian-family-png-image_18437652.webp');
        background-size: cover;
        background-position: center;
    }

    .item {
        position: absolute;
        font-size: 40px;
    }

    #score {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 26px;
        color: #ffb7d5;
        font-weight: bold;
        text-shadow: 0 0 5px black;
    }

    #message {
        position: absolute;
        top: 35%;
        width: 100%;
        text-align: center;
        font-size: 36px;
        color: #ffb7d5;
        display: none;
        font-weight: bold;
        text-shadow: 0 0 10px #ff4da6, 0 0 20px #ff4da6;
        animation: fadeIn 1.5s ease-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    .sakura {
        position: fixed;
        top: -10px;
        width: 15px;
        height: 15px;
        background: pink;
        opacity: 0.8;
        border-radius: 50%;
        animation: fall 6s linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(120vh) rotate(360deg); }
    }

    /* 🎁 Bouton surprise */
    #surpriseBtn {
        padding: 12px 25px;
        font-size: 22px;
        background: #ffb7d5;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        color: white;
        font-weight: bold;
        text-shadow: 0 0 5px #ff4da6;
        box-shadow: 0 0 10px #ff4da6;
        transition: 0.2s;
    }

    #surpriseBtn:hover {
        transform: scale(1.1);
        background: #ff8cbc;
    }

    /* 📱 Message d'aide mobile */
    #tapHelp {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(0,0,0,0.4);
        padding: 10px 15px;
        border-radius: 10px;
        color: white;
        font-size: 18px;
        display: none;
    }
</style>
</head>
<body>

<div id="player"></div>
<div id="score">점수 : 0</div>

<div id="message">
    축하해! 너는 이겼어!<br><br>
    이제 진짜 서프라이즈를 보러 가자!!
</div>

<div id="tapHelp">📱 화면을 터치해서 점프!</div>

<!-- 🎵 Musique d'ambiance -->
<audio id="bgm" autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7f4a3f2e3b.mp3?filename=sakura-lofi-ambient-110253.mp3" type="audio/mpeg">
</audio>

<script>
    const bgm = document.getElementById("bgm");
    bgm.volume = 0;

    document.addEventListener("click", () => {
        if (bgm.paused) bgm.play();

        let v = 0;
        const fade = setInterval(() => {
            if (v >= 0.35) clearInterval(fade);
            else {
                v += 0.02;
                bgm.volume = v;
            }
        }, 150);
    });

    const player = document.getElementById("player");
    const scoreDisplay = document.getElementById("score");
    const message = document.getElementById("message");
    const tapHelp = document.getElementById("tapHelp");

    let score = 0;
    let jumping = false;
    let gameOver = false;

    /* 🖥️ Saut clavier */
    document.addEventListener("keydown", () => {
        if (!jumping) jump();
    });

    /* 📱 Saut tactile */
    document.addEventListener("touchstart", (e) => {
        e.preventDefault();  // empêche scroll/zoom
        tapHelp.style.display = "none";
        if (!jumping) jump();
    }, { passive: false });

    /* 🖱️ Saut clic */
    document.addEventListener("mousedown", () => {
        tapHelp.style.display = "none";
        if (!jumping) jump();
    });

    /* 📱 Affiche l'aide mobile */
    setTimeout(() => {
        tapHelp.style.display = "block";
    }, 1500);

    function jump() {
        jumping = true;
        let height = 0;
        let up = setInterval(() => {
            if (height >= 140) {
                clearInterval(up);
                let down = setInterval(() => {
                    if (height <= 0) {
                        clearInterval(down);
                        jumping = false;
                    }
                    height -= 5;
                    player.style.bottom = 20 + height + "px";
                }, 20);
            }
            height += 5;
            player.style.bottom = 20 + height + "px";
        }, 20);
    }

    function spawnItem() {
        if (gameOver) return;

        const item = document.createElement("div");
        item.classList.add("item");

        let type = Math.random() < 0.7 ? "chicken" : "carrot";
        item.textContent = type === "chicken" ? "🍗" : "🥕";

        const heights = [20, 80, 140];
        item.style.bottom = heights[Math.floor(Math.random() * heights.length)] + "px";

        item.style.left = window.innerWidth + "px";
        document.body.appendChild(item);

        let move = setInterval(() => {
            let left = parseInt(item.style.left);
            item.style.left = left - 7 + "px";

            const playerRect = player.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();

            if (
                itemRect.left < playerRect.right &&
                itemRect.right > playerRect.left &&
                itemRect.bottom > playerRect.top &&
                itemRect.top < playerRect.bottom
            ) {
                if (type === "carrot") {
                    endGame();
                } else {
                    score++;
                    scoreDisplay.textContent = "점수 : " + score;
                    if (score >= 30) winGame();
                }
                item.remove();
                clearInterval(move);
            }

            if (left < -50) {
                item.remove();
                clearInterval(move);
            }
        }, 20);

        setTimeout(spawnItem, 700 + Math.random() * 600);
    }

    spawnItem();

    function endGame() {
        gameOver = true;
        message.innerHTML = "🥕 게임 오버!<br>다시 도전해봐!";
        message.style.display = "block";
    }

    function winGame() {
        gameOver = true;
        message.innerHTML = `
            축하해! 너는 이겼어!<br><br>
            이제 진짜 서프라이즈를 보러 가자!!<br><br>
            <button id="surpriseBtn">🎁 서프라이즈 보기</button>
        `;
        message.style.display = "block";

        setTimeout(() => {
            const btn = document.getElementById("surpriseBtn");
            btn.addEventListener("click", () => {
                window.location.href = "page_messages.html";
            });
        }, 100);
    }

    function createSakura() {
        const petal = document.createElement("div");
        petal.classList.add("sakura");
        petal.style.left = Math.random() * window.innerWidth + "px";
        petal.style.animationDuration = (4 + Math.random() * 4) + "s";
        document.body.appendChild(petal);

        setTimeout(() => petal.remove(), 8000);
    }

    setInterval(createSakura, 300);
</script>

</body>
</html>
