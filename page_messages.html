<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>💌 징니에게 보내는 메시지</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-image: url('https://images4.alphacoders.com/133/thumb-1920-1332281.jpeg');
        background-size: cover;
        background-position: center;
        font-family: "Pretendard", sans-serif;
        color: white;
        text-shadow: 0 0 8px black;
    }

    .container {
        background: rgba(0,0,0,0.55);
        width: 70%;
        margin: 60px auto;
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(6px);
    }

    h1 {
        text-align: center;
        font-size: 40px;
        margin-bottom: 20px;
        color: #ffb7d5;
        text-shadow: 0 0 12px #ff4da6;
    }

    .message {
        font-size: 22px;
        line-height: 1.6;
        margin-bottom: 25px;
        padding: 15px;
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
    }

    .footer {
        text-align: center;
        margin-top: 40px;
        font-size: 18px;
        opacity: 0.8;
    }
</style>
</head>
<body>

<div class="container">
    <h1>💌 징니에게 보내는 메시지</h1>

 <!-- 🌸🌸🌸 ICI TU AJOUTES LES MESSAGES DE LA COMMU 🌸🌸🌸 -->

<!-- 🌸 Message 1 -->
<div class="message">
    💬 "1주년 축하해요!  
    행복을 줘서 고마워요."
</div>

<!-- 🎥 Message 2 : vidéo YouTube -->
<div class="message">
    <iframe width="100%" height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        frameborder="0" allowfullscreen>
    </iframe>
</div>

<!-- 🎬 Message 3 : vidéo MP4 -->
<div class="message">
    <video width="100%" controls>
        <source src="insta.mp4">
    </video>
</div>

<!-- ⭐🎥 Message 4 : TA VIDÉO Jingnivideo.mp4 -->
<div class="message">
    <video width="100%" controls playsinline style="border-radius:15px;">
        <source src="Jingnivideo.mp4" type="video/mp4">
        Ton navigateur ne peut pas lire cette vidéo.
    </video>
</div>

<!-- 💖 Message 5 : ton long message -->
<div class="message">
    ... (TON TEXTE LONG ICI, inchangé)
</div>

<!-- 💖 Message 6 : version coréenne -->
<div class="message">
    1<br><br>2<br><br>3<br><br>4
</div>

<!-- 🌙 Message 7 : citation -->
<div class="message">
    🌙 "징니야, 이 페이지는 너를 사랑하는 사람들의 마음이 모인 곳이야.  
    하나하나가 너를 위해 준비된 진심이야." — 니로콰
</div>

<!-- 🌸🌸🌸 FIN DE LA ZONE DES MESSAGES 🌸🌸🌸 -->

    <div class="footer">
        Made with ❤️ by Nirokwa
    </div>
</div>

</body>
</html>
